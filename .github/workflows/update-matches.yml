name: Update match schedule

# Twice an hour so live / finished states stay current (GitHub may start scheduled runs late
# under load), and manually from the Actions tab (Run workflow) for testing.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-matches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The script's own tests; a failing test stops the run before the file is touched.
      - name: Test update script
        run: python -m unittest discover -s scripts

      - name: Build matches.json
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          # Optional second source for leagues/cups football-data's plan lacks; unset = skipped.
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/update_matches.py

      # Commit only when the schedule really changed (the script leaves the file untouched otherwise).
      - name: Commit if changed
        run: |
          if [ ! -f matches/matches.json ]; then
            echo "No schedule file yet."
            exit 0
          fi
          git add matches/matches.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update match schedule"
          git push
